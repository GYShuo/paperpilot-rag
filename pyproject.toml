[project]
name = "paper-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "“shuo”", email = "shuo11@tutamail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.1.0",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
paper-rag = "paper_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
